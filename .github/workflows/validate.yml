name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run quick validator
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path
          import yaml

          text = Path('skill/skyrim-engineering/SKILL.md').read_text(encoding='utf-8')
          match = re.match(r'^---\n(.*?)\n---', text, re.DOTALL)
          if not match:
              raise SystemExit('Invalid or missing SKILL.md frontmatter')
          data = yaml.safe_load(match.group(1))
          if not isinstance(data, dict) or data.get('name') != 'skyrim-engineering' or not data.get('description'):
              raise SystemExit('Invalid Skyrim engineering skill metadata')
          if set(data) - {'name', 'description', 'license', 'allowed-tools', 'metadata'}:
              raise SystemExit('Unexpected SKILL.md frontmatter field')
          print('Skill is valid!')
          '@ | python -

      - name: Parse PowerShell with the parser API
        shell: pwsh
        run: |
          $errors = foreach ($path in Get-ChildItem -Recurse -File -Include *.ps1,*.psm1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) { "$($path.FullName): $($parseError.Message)" }
          }
          if ($errors) { $errors | Write-Error; exit 1 }

      - name: Run Pester
        id: pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.9.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'TestResults/Pester.xml'
          Invoke-Pester -Configuration $config

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Upload failing Pester results
        if: failure() && steps.pester.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults/Pester.xml
          if-no-files-found: ignore
          retention-days: 7
